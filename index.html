<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tech Finds & Essentials</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            warmBg: '#FAF8F5',
            warmCard: '#FFFFFF',
            sageAccent: '#E8F0EC',
            sageText: '#2D4A3E',
            amberAccent: '#FCEFE3',
            amberText: '#8A4B10'
          }
        }
      }
    }
  </script>
</head>
<body class="bg-warmBg text-gray-800 font-sans min-h-screen pb-12">

  <!-- Header & Search -->
  <header class="sticky top-0 z-50 bg-warmBg/90 backdrop-blur-md border-b border-gray-200/60 px-4 py-3">
    <div class="max-w-5xl mx-auto flex items-center justify-between gap-3">
      <div class="flex items-center gap-2">
        <div class="w-8 h-8 rounded-full bg-amberText/10 text-amberText flex items-center justify-center font-bold text-sm">✨</div>
        <h1 class="font-bold text-gray-900 text-base sm:text-lg">Tech Finds & Essentials</h1>
      </div>
      <div class="relative flex-1 max-w-xs">
        <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 text-xs"></i>
        <input type="text" id="searchInput" placeholder="Search BenQ, Govee, Logitech..." 
               class="w-full bg-white border border-gray-200 rounded-full pl-8 pr-4 py-1.5 text-xs focus:outline-none focus:ring-2 focus:ring-sageText/30 shadow-sm">
      </div>
    </div>
  </header>

  <!-- Hero Banner -->
  <section class="max-w-5xl mx-auto px-4 pt-8 pb-4 text-center sm:text-left">
    <h2 class="text-2xl sm:text-3xl font-extrabold text-gray-900 tracking-tight mb-2">Tech Finds & Essentials</h2>
    <p class="text-xs sm:text-sm text-gray-600 mb-6">Curated collection of the best tech gadgets, cozy desk setup gear, and smart tools.</p>
    
    <!-- Category Filter Pills -->
    <div class="flex flex-wrap gap-2 justify-center sm:justify-start" id="categoryPills">
      <button onclick="filterCategory('all')" class="cat-btn bg-sageText text-white px-3.5 py-1.5 rounded-full text-xs font-medium shadow-sm transition">✨ All Products</button>
      <button onclick="filterCategory('desk')" class="cat-btn bg-amberAccent text-amberText px-3.5 py-1.5 rounded-full text-xs font-medium hover:bg-amberText hover:text-white transition">🛋️ Aesthetic Desk Setup</button>
    </div>
  </section>

  <!-- Product Grid -->
  <main class="max-w-5xl mx-auto px-4 mt-6">
    <div id="product-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6"></div>
  </main>

  <script>
    // Data Produk Amazon Affiliate (Aesthetic Desk Setup)
    const products = [
      {
        id: 1,
        title: "BenQ ScreenBar Halo 2 LED Monitor Light Bar - Wireless Controller, Backlight, Motion Sensor",
        category: "desk",
        price: "$209.99",
        badge: "Overall pick",
        image: "https://images.unsplash.com/photo-1527443224154-c4a3942d3acf?w=600&auto=format&fit=crop",
        link: "https://www.amazon.com/dp/B0DK59YKRS",
        rating: "4.7"
      },
      {
        id: 2,
        title: "Govee Smart Light Bar, RGBICWW TV Lights for Living Room, Gaming, Black",
        category: "desk",
        price: "$54.99",
        badge: "Overall pick",
        image: "https://images.unsplash.com/photo-1545454675-3531b543be5d?w=600&auto=format&fit=crop",
        link: "https://www.amazon.com/dp/B096WZXKZP",
        rating: "4.6"
      },
      {
        id: 3,
        title: "Nordik Leather Desk Mat - Pebble Black - Large Leather Desk Pad 35x17 in",
        category: "desk",
        price: "$22.97",
        badge: "Overall pick",
        image: "https://images.unsplash.com/photo-1616440342855-5463f8430b35?w=600&auto=format&fit=crop",
        link: "https://www.amazon.com/dp/B086X1HZ8W",
        rating: "4.7"
      },
      {
        id: 4,
        title: "Logitech MX Master 3S Bluetooth Wireless Mouse No Receiver - Graphite",
        category: "desk",
        price: "$79.80",
        badge: "Overall Pick",
        image: "https://images.unsplash.com/photo-1615663245857-ac93bb7c39e7?w=600&auto=format&fit=crop",
        link: "https://www.amazon.com/dp/B0FB21526X",
        rating: "4.6"
      },
      {
        id: 5,
        title: "Logitech POP Keys Wireless Mechanical Keyboard with Emoji Keys - Rose",
        category: "desk",
        price: "$76.99",
        badge: "Overall Pick",
        image: "https://images.unsplash.com/photo-1587829741301-dc798b83add3?w=600&auto=format&fit=crop",
        link: "https://www.amazon.com/dp/B09DVLTFJR",
        rating: "4.6"
      }
    ];

    function renderProducts(items) {
      const grid = document.getElementById('product-grid');
      if (!grid) return;
      grid.innerHTML = items.map(item => `
        <div class="bg-white rounded-2xl p-4 border border-gray-100 shadow-sm hover:shadow-md transition flex flex-col justify-between">
          <div>
            <div class="relative w-full h-48 rounded-xl overflow-hidden mb-3 bg-gray-100">
              <img src="${item.image}" alt="${item.title}" class="w-full h-full object-cover">
              <span class="absolute top-2 left-2 bg-white/90 backdrop-blur px-2.5 py-1 rounded-full text-[10px] font-bold text-amberText shadow-sm">
                ${item.badge}
              </span>
            </div>
            <div class="flex items-center justify-between mb-1">
              <span class="text-[10px] font-bold uppercase tracking-wider text-sageText">Aesthetic Desk Setup</span>
              <span class="text-xs text-amber-500 font-bold">★ ${item.rating}</span>
            </div>
            <h3 class="font-semibold text-gray-900 text-sm mb-3 line-clamp-2" title="${item.title}">${item.title}</h3>
          </div>
          <div class="flex items-center justify-between pt-3 border-t border-gray-50">
            <span class="text-base font-bold text-gray-900">${item.price}</span>
            <a href="${item.link}" target="_blank" rel="noopener noreferrer" 
               class="bg-sageText text-white px-3.5 py-1.5 rounded-xl text-xs font-medium hover:bg-gray-800 transition flex items-center gap-1.5 shadow-sm">
              Check Price <i class="fa-solid fa-arrow-up-right-from-square text-[10px]"></i>
            </a>
          </div>
        </div>
      `).join('');
    }

    function filterCategory(cat) {
      if (cat === 'all') {
        renderProducts(products);
      } else {
        const filtered = products.filter(p => p.category === cat);
        renderProducts(filtered);
      }
    }

    document.getElementById('searchInput')?.addEventListener('input', (e) => {
      const query = e.target.value.toLowerCase();
      const filtered = products.filter(p => p.title.toLowerCase().includes(query));
      renderProducts(filtered);
    });

    document.addEventListener('DOMContentLoaded', () => {
      renderProducts(products);
    });
  </script>
</body>
</html>
